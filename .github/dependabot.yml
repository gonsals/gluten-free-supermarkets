version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      expo:
        patterns:
          [
            'expo*',
            '@expo/*',
            'react',
            'react-dom',
            'react-native*',
            '@react-native/*',
            'jest-expo',
          ]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
