name: Comprobaciones
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 scripts/scan-secrets.py
  app:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  firebase:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run lint:server
      - run: npm --prefix functions run build
      - run: npm run test:rules
      - run: npm run test:cloud
  android:
    needs: secrets
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: beta
      EXPO_PUBLIC_CLOUD_ENABLED: 'false'
      EXPO_PUBLIC_USE_EMULATORS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          NODE_ENV: production
      - run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
        working-directory: android
        env:
          NODE_ENV: production
      - name: Inspect embedded Android preview
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          assert os.environ['EXPO_PUBLIC_CLOUD_ENABLED'] == 'false'
          apk = Path('android/app/build/outputs/apk/release/app-release.apk')
          metadata = dict(sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),
                          architectures=['arm64-v8a'], variant='preview', requiresMetro=False,
                          cloudEnabled=False, signing='development-key-not-for-stores')
          apk.with_suffix('.json').write_text(json.dumps(metadata), encoding='utf-8')
          PY
          python3 scripts/inspect-android-apk.py android/app/build/outputs/apk/release/app-release.apk --report artifacts/android-ci-inspection.json
  dependencies:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:security
