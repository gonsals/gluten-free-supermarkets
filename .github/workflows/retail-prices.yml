name: Actualizar catálogo público de supermercados
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/update-retail-prices.cjs
      - scripts/lib/retail-parsers.cjs
      - .github/workflows/retail-prices.yml
      - src/domain/retailCatalog.ts
      - src/domain/retailSources.ts
      - tests/security/barcelona-parsers.test.mjs
      - tests/fixtures/retail-pages.cjs
      - tests/security/retail-parsers.test.mjs
      - tests/security/retail-updater.test.mjs
  # GitHub only runs schedules on the default branch. See docs/PRECIOS_SUPERMERCADOS.md.
  schedule:
    - cron: '25 6 * * *'
permissions:
  contents: read
concurrency:
  group: retail-prices-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'gonsals/gluten-free-supermarkets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test tests/security/retail-parsers.test.mjs tests/security/barcelona-parsers.test.mjs tests/security/retail-updater.test.mjs
      - id: refresh
        continue-on-error: true
        run: node scripts/update-retail-prices.cjs
      - name: Commit only public prices, preserving source dates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/retail-prices.es.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public supermarket price snapshot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - if: steps.refresh.outcome == 'failure'
        run: exit 1
